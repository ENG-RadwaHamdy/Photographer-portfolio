<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Primary meta tags
    -->
    <title>Richard Ryan</title>
    <meta name="title" content="Richard Ryan">
    <meta name="description" content="This is a photographer portfolio html template, made by Radwa Hamdy.">

    <!--
        Favicon
    -->
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

    <!--
     Custom css link
    -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- 
        Custom font link
    -->
    <link rel="stylesheet" href="assets/font/font.css">

    <!-- 
        preload images
    -->
</head>
<body class="active">
    <!-- #preloading -->
    <div class="loading" data-loading>
        <img src="assets/images/loading.svg" height="55" width="55" alt="loading" class="img">
        <img src="assets/images/loading-circle.svg" alt="loading-circle" height="70"  width="70" class="circle">
    </div>

    <!-- header -->
     <header class="header" data-header>
        <div class="container">

            <a href="#" class="logo">
                <img src="assets/images/logo.svg" width="40" height="40" alt="Richard home">
            </a>

            <button class="nav-open-btn" aria-label="open menu">
                <img src="assets/images/menu.svg" width="17" height="17" alt="menu icon">
            </button>

            <nav class="nav-bar" data-navbar>
                <div class="navbar-top">
                    <a href="#" class="logo">
                        <img src="assets/images/nav-logo.svg" width="140" height="40" alt="Richard home">
                    </a>
                    <button class="nav-close-btn" aria-label="close menu">
                        <span class="span one"></span>
                        <span class="span two"></span>
                    </button>
                </div>

                <ul class="navbar-list">

                    <li class="navbar-item">
                        <a href="#home" class="navbar-link">Home</a>
                    </li>

                    <li class="navbar-item">
                        <a href="#gallery" class="navbar-link">Gallery</a>
                    </li>

                    <li class="navbar-item">
                        <a href="#about" class="navbar-link">About</a>
                    </li>

                    <li class="navbar-item">
                        <a href="#services" class="navbar-link">Services</a>
                    </li>

                    <li class="navbar-item">
                        <a href="#portfolio" class="navbar-link">Portfolio</a>
                    </li>

                    <li class="navbar-item">
                        <a href="#contact" class="navbar-link">Contact us</a>
                    </li>

                </ul>

                <button class="login-btn">
                    <img src="assets/images/user.svg" width="21" height="21" alt="user icon">

                    <span class="span">Login</span>
                </button>

                <p class="navbar-title">My Address</p>

                <address class="navbar-text">
                    3287 Indiana Avenue, Waialua, Hawaii
                </address>

                <p class="navbar-text">
                    Urgent issue? call us at
                    <a href="#" class="contact-link">808-561-3846</a>
                </p>
            </nav>
        </div>
     </header>

    <!-- 
        custom js link
    -->
    <script src="assets/js/script.js"></script>
    
</body>
</html>
